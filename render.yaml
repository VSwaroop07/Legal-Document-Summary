services:
  - type: web
    name: legal-summarizer-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: text-embedding-004
      - key: NEWS_API_KEY
        sync: false
      - key: NEWS_JOB_ENABLED
        value: "true"
      - key: GEMINI_DAILY_CALL_LIMIT
        value: "20"
      - key: GEMINI_TIMEOUT_MS
        value: "30000"
